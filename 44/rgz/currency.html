<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Самолет - Курс валют</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <script>
    let currentRate = 1;

    async function fetchRates() {
      try {
        const response = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        const data = await response.json();
        currentRate = data.Valute.UAH.Value / data.Valute.UAH.Nominal;
        document.getElementById("rate").textContent = currentRate.toFixed(4);
        document.getElementById("rateInfo").textContent = `1 UAH = ${(1/currentRate).toFixed(4)} RUB`;
      } catch (error) {
        console.error('Ошибка загрузки курса:', error);
        document.getElementById("rate").textContent = "Ошибка";
      }
    }

    function convertToUAH() {
      const rub = parseFloat(document.getElementById("rub").value);
      if (!isNaN(rub)) {
        document.getElementById("uah").value = (rub / currentRate).toFixed(2);
        updateConversionText(rub, 'RUB', rub / currentRate, 'UAH');
      }
    }

    function convertToRUB() {
      const uah = parseFloat(document.getElementById("uah").value);
      if (!isNaN(uah)) {
        document.getElementById("rub").value = (uah * currentRate).toFixed(2);
        updateConversionText(uah, 'UAH', uah * currentRate, 'RUB');
      }
    }

    function updateConversionText(fromAmount, fromCurrency, toAmount, toCurrency) {
      const conversionText = document.getElementById("conversionText");
      conversionText.innerHTML = `
        <strong>${fromAmount} ${fromCurrency} = ${toAmount.toFixed(2)} ${toCurrency}</strong>
      `;
    }

    async function loadChart() {
      const today = new Date();
      const fetchTasks = [];

      for (let i = 0; i < 30; i++) {
        const date = new Date(today);
        date.setDate(today.getDate() - i);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const label = `${dd}.${mm}`;
        const url = `https://www.cbr-xml-daily.ru/archive/${yyyy}/${mm}/${dd}/daily_json.js`;

        fetchTasks.push(
          fetch(url)
            .then(res => res.ok ? res.json() : null)
            .then(data => {
              if (data && data.Valute && data.Valute.UAH) {
                return { 
                  label, 
                  value: data.Valute.UAH.Value / data.Valute.UAH.Nominal 
                };
              }
              return null;
            })
            .catch(() => null)
        );
      }

      const results = await Promise.all(fetchTasks);
      const filtered = results.filter(item => item !== null).reverse();

      const labels = filtered.map(item => item.label);
      const values = filtered.map(item => item.value);

      const ctx = document.getElementById('rateChart').getContext('2d');
      const chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Курс UAH к RUB',
            data: values,
            backgroundColor: '#0056b3',
            borderColor: '#003d82',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: 'RUB за 1 UAH'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Дата'
              }
            }
          },
          onClick: (e, items) => {
            if (items.length > 0) {
              const index = items[0].index;
              const infoDiv = document.getElementById('chartInfo');
              infoDiv.innerHTML = `
                <div class="chart-point-info">
                  <strong>${labels[index]}</strong><br>
                  <strong>${values[index].toFixed(4)} RUB</strong>
                </div>
              `;
              
              // Подсветка выбранного столбца
              chart.data.datasets[0].backgroundColor = values.map((_, i) => 
                i === index ? '#ff6b6b' : '#0056b3'
              );
              chart.update();
            }
          }
        }
      });
    }

    
    document.addEventListener('DOMContentLoaded', function() {
      fetchRates();
      loadChart();
    });
  </script>
</head>
<body>
  <header>
    <div class="menu-icon" id="menuToggle">☰</div>
    <nav class="sidebar" id="sidebar">
      <ul>
        <li><a href="index.html">О компании</a></li>
        <li><a href="news.html">Новости</a></li>
        <li><a href="currency.html" class="active">Курс валют</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li><a href="video.html">Видео</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <h1>Курс валют</h1>
      
      <div class="currency-banner">
        <h2>🇺🇦 Украинская гривна (UAH)</h2>
        <p>Актуальный курс для расчетов с партнерами</p>
      </div>

      <div class="currency-content">
        <div class="current-rate-card">
          <h3>Текущий курс</h3>
          <div class="rate-display">
            <span id="rate">Загрузка...</span>
            <div id="rateInfo"></div>
          </div>
        </div>

        <div class="converter-card">
          <h3>Калькулятор валют</h3>
          <div class="converter-inputs">
            <div class="input-group">
              <label>Рубли (RUB):</label>
              <input type="number" id="rub" placeholder="0.00" oninput="convertToUAH()">
            </div>
            
            <div class="swap-icon">⇄</div>
            
            <div class="input-group">
              <label>Гривны (UAH):</label>
              <input type="number" id="uah" placeholder="0.00" oninput="convertToRUB()">
            </div>
          </div>
          
          <div id="conversionText" class="conversion-result"></div>
        </div>

        <div class="chart-card">
          <h3>Динамика курса за 30 дней</h3>
          <div class="chart-container">
            <canvas id="rateChart" width="400" height="200"></canvas>
          </div>
          <div id="chartInfo" class="chart-info"></div>
      </div>
    </div>
    
    <a href="#" class="back-to-top" id="backToTop">↑ Наверх</a>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
