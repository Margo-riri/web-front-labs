<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Размахнина Маргарита Михайлоана. Лабораторная 7</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-32x32.png">
    <link rel="icon" href="../favicon-16x16.png">
    <script>

        const prices = [1466.50, 1452.00, 1432.50, 1428.00, 1429.50, 1409.00, 1444.00, 1424.00, 1411.00, 1410.50];
        const dates = [
            '20.05.2025', '21.05.2025', '22.05.2025', '23.05.2025', '26.05.2025',
            '27.05.2025', '28.05.2025', '29.05.2025', '30.05.2025', '02.06.2025'
        ];

        function showStockData() {
            const table = document.getElementById('stock-table');
            const tbody = table.querySelector('tbody');
            const summary = document.getElementById('summary');
            tbody.innerHTML = '';

            let sum = 0;
            let max = prices[0];
            let min = prices[0];

            for (let i = 0; i < prices.length; i++) {
                const tr = document.createElement('tr');
                const tdDate = document.createElement('td');
                const tdPrice = document.createElement('td');
                const tdDiff = document.createElement('td');

                tdDate.textContent = dates[i];
                tdPrice.textContent = prices[i].toFixed(2);

                if (i === 0) {
                    tdDiff.textContent = '–';
                    tdDiff.className = 'neutral';
                } else {
                    const diff = (prices[i] - prices[i - 1]).toFixed(2);
                    tdDiff.textContent = diff > 0 ? `+${diff}` : diff;
                    tdDiff.className = diff > 0 ? 'positive' : (diff < 0 ? 'negative' : 'neutral');
                }

                sum += prices[i];
                if (prices[i] > max) max = prices[i];
                if (prices[i] < min) min = prices[i];

                tr.appendChild(tdDate);
                tr.appendChild(tdPrice);
                tr.appendChild(tdDiff);
                tbody.appendChild(tr);
            }

            const average = (sum / prices.length).toFixed(2);
            summary.innerHTML = `
                Средняя стоимость: <strong>${average} руб</strong><br>
                Максимальная стоимость: <strong>${max.toFixed(2)} руб</strong><br>
                Минимальная стоимость: <strong>${min.toFixed(2)} руб</strong>
            `;

            table.style.display = 'table';
            summary.style.display = 'block';
            document.getElementById('stock-btn').disabled = true;
        }
    </script>
    <style>
        #stock-btn {
            margin: 15px 0;
            padding: 8px 16px;
            font-size: 16px;
            background-color: rgb(38, 139, 51);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #stock-btn:disabled {
            background-color: rgb(185, 162, 162);
            cursor: not-allowed;
        }

        #stock-table {
            margin: 20px auto;
            border-collapse: collapse;
            font-size: 16px;
            text-align: center;
            display: none;
        }

        #stock-table th, #stock-table td {
            border: 1px solid rgb(139, 38, 38);
            padding: 8px 12px;
        }

        .positive {
            color: green;
            font-weight: bold;
        }

        .negative {
            color: red;
            font-weight: bold;
        }

        .neutral {
            color: black;
        }

        #summary {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            display: none;
            background-color: #f1ebeb;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #9b0808;
        }
    </style>
</head>
<body>
    <header>
        НГТУ, ФБ, Лабораторная работа 7
    </header>

    <main>
        <h1>Котировки компании "Лента"</h1>
        <button id="stock-btn" onclick="showStockData()">Курс акций Лента</button>
        <table id="stock-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Цена, руб</th>
                    <th>Изменение</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div id="summary"></div>
    </main>

    <footer>
        &copy; Размахнина Маргарита, ФБИ-31, 2 курс, 2025
    </footer>

</body>
</html>
